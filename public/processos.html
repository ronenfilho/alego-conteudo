<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbla - Estudos</title>
    <link rel="stylesheet" href="css/processos.css">
</head>
<body>
    <div class="header-compact">
        <div class="header-content">
            <div class="header-badge">📚 Abbla</div>
            <h1 class="page-title-compact">Estudos</h1>
        </div>
        <div class="user-info-compact">
            <span id="userName" class="user-name">Carregando...</span>
            <button class="btn-logout-compact" id="logoutBtn" title="Sair">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
            </button>
        </div>
    </div>
    
    <div class="container">
        <div class="actions-bar">
            <button class="btn-primary" id="newProcessBtn">
                <span>➕</span> Novo Estudo
            </button>
        </div>
        
        <div class="processos-grid" id="processosGrid">
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Carregando processos...</p>
            </div>
        </div>
        
        <div class="empty-state" id="emptyState" style="display: none;">
            <div class="empty-icon">📋</div>
            <h2>Nenhum estudo cadastrado</h2>
            <p>Clique no botão acima para criar seu primeiro estudo</p>
        </div>
    </div>
    
    <!-- Modal para Criar/Editar Processo -->
    <div class="modal" id="processModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Programa de Estudo</h2>
                <button class="close-btn" id="closeModal">&times;</button>
            </div>
            
            <form id="processForm">
                <div class="form-group">
                    <label for="processName">Nome do Processo *</label>
                    <input type="text" id="processName" placeholder="Ex: Analista Legislativo - ALEGO" required>
                </div>
                
                <div class="form-group">
                    <label for="processDescription">Descrição</label>
                    <textarea id="processDescription" rows="3" placeholder="Descrição opcional do estudo"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="processContent">Conteúdo (Markdown) *</label>
                    <textarea id="processContent" rows="15" placeholder="Digite o conteúdo em Markdown...

# Exemplo de Markdown

## Disciplinas
- **Português**: 10 questões
- **Raciocínio Lógico**: 5 questões

## Cronograma
1. Fase 1: Prova objetiva
2. Fase 2: Prova discursiva" required></textarea>
                </div>
                
                <div class="form-actions">
                    <button type="button" class="btn-secondary" id="cancelBtn">Cancelar</button>
                    <button type="submit" class="btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        // Importar configuração
        import { firebaseConfig } from './js/firebase-config.js';
        
        // Inicializar Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Disponibilizar globalmente
        window.firebaseApp = app;
        window.firebaseAuth = auth;
        window.firebaseDb = db;
    </script>
    <script src="js/processos.js" type="module"></script>
</body>
</html>
