<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbla - Progresso de Estudos</title>
    <link rel="stylesheet" href="css/estudo.css?v=20251126-2">
    <link rel="stylesheet" href="css/embed-modal.css">
</head>
<body>
    <div class="container">
        <div class="header-compact">
            <button class="btn-back-compact" onclick="window.location.href='processos.html'" title="Voltar para processos">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <div class="header-content">
                <div class="header-badge">📊 Estudos</div>
                <div id="pageTitle" class="page-title-compact">
                    <div class="skeleton skeleton-text"></div>
                </div>
            </div>
        </div>

        <div class="progress-overview" id="progressOverview" style="display: none;">
            <div class="progress-card">
                <h2>Progresso Geral</h2>                
                <div class="progress-bar-container">
                    <div class="progress-bar" id="totalProgress">0%</div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalPercent">0%</div>
                        <div class="stat-label">Concluído</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalTopics">0</div>
                        <div class="stat-label">Total de Tópicos</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="completedTopics">0</div>
                        <div class="stat-label">Tópicos Completos (10/10)</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="averageScore">0.0</div>
                        <div class="stat-label">Nota Média</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Skeleton Progress Overview -->
        <div class="skeleton-progress-overview" id="skeletonProgressOverview">
            <div class="skeleton-progress-card">
                <div class="skeleton skeleton-progress-title"></div>
                <div class="skeleton skeleton-progress-bar"></div>
                <div class="skeleton-stats-grid">
                    <div class="skeleton-stat">
                        <div class="skeleton skeleton-stat-value"></div>
                        <div class="skeleton skeleton-stat-label"></div>
                    </div>
                    <div class="skeleton-stat">
                        <div class="skeleton skeleton-stat-value"></div>
                        <div class="skeleton skeleton-stat-label"></div>
                    </div>
                    <div class="skeleton-stat">
                        <div class="skeleton skeleton-stat-value"></div>
                        <div class="skeleton skeleton-stat-label"></div>
                    </div>
                    <div class="skeleton-stat">
                        <div class="skeleton skeleton-stat-value"></div>
                        <div class="skeleton skeleton-stat-label"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content" id="disciplinesContainer">
            <!-- Skeleton Loading -->
            <div class="skeleton-container" id="skeletonLoader">
                <!-- Categoria 1 -->
                <div class="skeleton-category">
                    <div class="skeleton skeleton-category-header"></div>
                    <div class="skeleton-category-content">
                        <div class="skeleton-discipline">
                            <div class="skeleton skeleton-discipline-header">
                                <div class="skeleton skeleton-discipline-title"></div>
                                <div class="skeleton skeleton-discipline-progress"></div>
                            </div>
                        </div>
                        <div class="skeleton-discipline">
                            <div class="skeleton skeleton-discipline-header">
                                <div class="skeleton skeleton-discipline-title"></div>
                                <div class="skeleton skeleton-discipline-progress"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Categoria 2 -->
                <div class="skeleton-category">
                    <div class="skeleton skeleton-category-header"></div>
                    <div class="skeleton-category-content">
                        <div class="skeleton-discipline">
                            <div class="skeleton skeleton-discipline-header">
                                <div class="skeleton skeleton-discipline-title"></div>
                                <div class="skeleton skeleton-discipline-progress"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Categoria 3 -->
                <div class="skeleton-category">
                    <div class="skeleton skeleton-category-header"></div>
                    <div class="skeleton-category-content">
                        <div class="skeleton-discipline">
                            <div class="skeleton skeleton-discipline-header">
                                <div class="skeleton skeleton-discipline-title"></div>
                                <div class="skeleton skeleton-discipline-progress"></div>
                            </div>
                        </div>
                        <div class="skeleton-discipline">
                            <div class="skeleton skeleton-discipline-header">
                                <div class="skeleton skeleton-discipline-title"></div>
                                <div class="skeleton skeleton-discipline-progress"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="buttons">
            <div class="save-status" id="saveStatusIndicator">
                <span>💾</span>
                <span id="saveStatusText">Salvo automaticamente</span>
            </div>
            
            <div class="actions-menu">
                <button class="btn-actions" onclick="toggleActionsMenu()">
                    <span>⚙️</span>
                    <span>Ações</span>
                    <span style="font-size: 0.8em">▼</span>
                </button>
                <div class="dropdown-content" id="actionsDropdown">
                    <div class="dropdown-item" onclick="exportProgress()">
                        <span>📥</span>
                        <span>Exportar JSON</span>
                    </div>
                    <div class="dropdown-item" onclick="document.getElementById('importFile').click()">
                        <span>📤</span>
                        <span>Importar JSON</span>
                    </div>
                    <div class="dropdown-item danger" onclick="resetProgress()">
                        <span>🔄</span>
                        <span>Resetar Tudo</span>
                    </div>
                </div>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
        </div>
    </div>

    <script type="module" src="js/estudo-main.js"></script>
    
    <script src="js/embed-modal.js"></script>

    <script>
        // Inicializar EmbedModal quando a página carregar
        window.addEventListener('load', () => {
            initEmbedModal();
        });
    </script>
</body>
