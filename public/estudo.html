<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abbla - Progresso de Estudos</title>
    <link rel="stylesheet" href="css/estudo.css">
    <link rel="stylesheet" href="css/embed-modal.css">
</head>
<body>
    <div class="container">
        <div class="header" style="position: relative; padding-top: 60px;">
            <button class="btn-back" id="backBtn" onclick="window.location.href='processos.html'" style="position: absolute; top: 15px; left: 20px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; z-index: 10;">← Voltar</button>
            <h1>📊 Controle de Estudos</h1>
            <p id="pageTitle">Carregando...</p>
        </div>

        <div class="progress-overview">
            <div class="progress-card">
                <h2>Progresso Geral</h2>                
                <div class="progress-bar-container">
                    <div class="progress-bar" id="totalProgress">0%</div>
                </div>
                <div class="stats">
                    <div class="stat-item">
                        <div class="stat-value" id="totalPercent">0%</div>
                        <div class="stat-label">Concluído</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="totalTopics">0</div>
                        <div class="stat-label">Total de Tópicos</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="completedTopics">0</div>
                        <div class="stat-label">Tópicos Completos (10/10)</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="averageScore">0.0</div>
                        <div class="stat-label">Nota Média</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="content" id="disciplinesContainer"></div>

        <div class="buttons">
            <div class="save-status" id="saveStatusIndicator">
                <span>💾</span>
                <span id="saveStatusText">Salvo automaticamente</span>
            </div>
            
            <div class="actions-menu">
                <button class="btn-actions" onclick="toggleActionsMenu()">
                    <span>⚙️</span>
                    <span>Ações</span>
                    <span style="font-size: 0.8em">▼</span>
                </button>
                <div class="dropdown-content" id="actionsDropdown">
                    <div class="dropdown-item" onclick="exportProgress()">
                        <span>📥</span>
                        <span>Exportar JSON</span>
                    </div>
                    <div class="dropdown-item" onclick="document.getElementById('importFile').click()">
                        <span>📤</span>
                        <span>Importar JSON</span>
                    </div>
                    <div class="dropdown-item danger" onclick="resetProgress()">
                        <span>🔄</span>
                        <span>Resetar Tudo</span>
                    </div>
                </div>
            </div>
            <input type="file" id="importFile" accept=".json" style="display:none" onchange="importProgress(event)">
        </div>
    </div>

    <script>
        let studyContent = {};
        let progressData = {};
        let currentProcessId = null;
        let currentProcesso = null;
        
        // Variáveis globais do Firestore
        let db = null;
        let auth = null;
        let setDoc = null;
        let getDoc = null;
        let doc = null;
        let serverTimestamp = null;

        // Função para carregar conteúdo do Firebase
        async function loadStudyContent() {
            try {
                // Pegar o ID do processo da URL
                const urlParams = new URLSearchParams(window.location.search);
                currentProcessId = urlParams.get('id');
                
                if (!currentProcessId) {
                    alert('❌ ID do processo não encontrado na URL');
                    window.location.href = 'processos.html';
                    return {};
                }

                // Importar Firebase e atribuir às variáveis globais
                const firestoreModule = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                doc = firestoreModule.doc;
                getDoc = firestoreModule.getDoc;
                setDoc = firestoreModule.setDoc;
                serverTimestamp = firestoreModule.serverTimestamp;
                db = window.firebaseDb;
                
                // Buscar processo no Firestore
                const docRef = doc(db, 'processos', currentProcessId);
                const docSnap = await getDoc(docRef);
                
                if (!docSnap.exists()) {
                    alert('❌ Processo não encontrado');
                    window.location.href = 'processos.html';
                    return {};
                }
                
                const processo = docSnap.data();
                currentProcesso = { id: currentProcessId, ...processo };
                document.getElementById('pageTitle').textContent = processo.name;
                
                // Parse do conteúdo markdown
                studyContent = parseMarkdownToContent(processo.content);
                return studyContent;
            } catch (error) {
                console.error('Erro ao carregar processo:', error);
                alert('❌ Erro ao carregar o processo do Firebase');
                return {};
            }
        }

        // Parser do Markdown para estrutura de dados
        function parseMarkdownToContent(markdown) {
            const content = {};
            const lines = markdown.split('\n');
            let currentCategory = null;
            let currentCategoryFull = null;
            let currentDiscipline = null;
            let currentDisciplineFull = null;

            for (let line of lines) {
                line = line.trim();
                if (!line) continue;

                // Ignore headings other than ## / ### that we handle explicitly
                if (line.startsWith('#') && !line.startsWith('## ') && !line.startsWith('### ')) {
                    continue;
                }

                // Detectar categoria (## TÍTULO) - Aceita qualquer ## que não seja ###
                if (line.startsWith('## ') && !line.startsWith('### ')) {
                    const fullTitle = line.replace(/^##\s+/, '').trim();
                    // Extrai nome base (sem a contagem) para usar como chave
                    const match = fullTitle.match(/^(.+?)(?:\s+-\s+(\d+))?$/);
                    const baseName = match ? match[1].trim() : fullTitle;

                    currentCategoryFull = fullTitle;
                    currentCategory = baseName;

                    if (!content[currentCategory]) {
                        content[currentCategory] = {
                            _fullTitle: currentCategoryFull,
                            disciplines: {}
                        };
                    }
                    currentDiscipline = null;
                    continue;
                }

                // Detectar disciplina (### TÍTULO)
                if (line.startsWith('### ') && currentCategory) {
                    const fullTitle = line.replace(/^###\s+/, '').trim();
                    const match = fullTitle.match(/^(.+?)(?:\s+-\s+(\d+))?$/);
                    const baseName = match ? match[1].trim() : fullTitle;

                    currentDisciplineFull = fullTitle;
                    currentDiscipline = baseName;

                    if (!content[currentCategory].disciplines[currentDiscipline]) {
                        content[currentCategory].disciplines[currentDiscipline] = {
                            _fullTitle: currentDisciplineFull,
                            topics: []
                        };
                    }
                    continue;
                }

                // Qualquer outra linha não-heading dentro de uma categoria é considerada tópico
                if (currentCategory) {
                    // Se não houver disciplina atual, cria uma disciplina com o nome da categoria
                    if (!currentDiscipline) {
                        currentDiscipline = currentCategory;
                        currentDisciplineFull = currentCategoryFull;

                        if (!content[currentCategory].disciplines[currentDiscipline]) {
                            content[currentCategory].disciplines[currentDiscipline] = {
                                _fullTitle: currentDisciplineFull,
                                topics: []
                            };
                        }
                    }

                    // Normaliza bullets (remover '- ' ou '* ' no início), preserva números
                    let topicLine = line.replace(/^[\-\*\u2022]\s+/, '').trim();
                    // Se a linha for curta após limpeza, use a linha original para preservar números/formatos
                    if (!topicLine) topicLine = line;

                    content[currentCategory].disciplines[currentDiscipline].topics.push(topicLine);
                }
            }

            return content;
        }

        let autoSaveTimer = null;
        let isSaving = false;

        // Salvar progresso no Firebase
        async function saveToFirebase() {
            if (isSaving || !currentProcessId) return;
            
            try {
                isSaving = true;
                updateSaveStatus('saving', 'Salvando...');
                
                const { getFirestore, doc, setDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const db = window.firebaseDb;
                const auth = window.firebaseAuth;
                
                if (!auth.currentUser) {
                    throw new Error('Usuário não autenticado');
                }
                
                // Salvar no Firestore
                const progressRef = doc(db, 'progress', `${auth.currentUser.uid}_${currentProcessId}`);
                await setDoc(progressRef, {
                    userId: auth.currentUser.uid,
                    processoId: currentProcessId,
                    data: progressData,
                    updatedAt: new Date()
                });
                
                updateSaveStatus('saved', 'Salvo automaticamente');
            } catch (error) {
                console.error('Erro ao salvar no Firebase:', error);
                updateSaveStatus('error', 'Erro ao salvar');
            } finally {
                isSaving = false;
            }
        }

        // Carregar progresso do Firebase
        async function loadFromFirebase() {
            try {
                const { getFirestore, doc, getDoc } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const db = window.firebaseDb;
                const auth = window.firebaseAuth;
                
                if (!auth.currentUser || !currentProcessId) return;
                
                const progressRef = doc(db, 'progress', `${auth.currentUser.uid}_${currentProcessId}`);
                const docSnap = await getDoc(progressRef);
                
                if (docSnap.exists()) {
                    progressData = docSnap.data().data || {};
                } else {
                    // Inicializa com zeros se não houver dados
                    progressData = {};
                    for (const [category, categoryData] of Object.entries(studyContent)) {
                        for (const [discipline, disciplineData] of Object.entries(categoryData.disciplines)) {
                            disciplineData.topics.forEach(topic => {
                                const key = `${category}|${discipline}|${topic}`;
                                progressData[key] = 0;
                            });
                        }
                    }
                }
                
                // Carregar notebooks dos tópicos
                await loadTopicNotebooks();
                
                updateSaveStatus('saved', 'Carregado do Firebase');
            } catch (error) {
                console.error('Erro ao carregar do Firebase:', error);
                // Inicializa vazio em caso de erro
                progressData = {};
                for (const [category, categoryData] of Object.entries(studyContent)) {
                    for (const [discipline, disciplineData] of Object.entries(categoryData.disciplines)) {
                        disciplineData.topics.forEach(topic => {
                            const key = `${category}|${discipline}|${topic}`;
                            progressData[key] = 0;
                        });
                    }
                }
            }
        }

        function updateSaveStatus(status, text) {
            const indicator = document.getElementById('saveStatusIndicator');
            const statusText = document.getElementById('saveStatusText');
            
            if (!indicator || !statusText) return;
            
            indicator.className = 'save-status';
            if (status === 'saving') {
                indicator.classList.add('saving');
            }
            
            statusText.textContent = text;
            
            if (status === 'saved') {
                setTimeout(() => {
                    if (statusText.textContent === text) {
                        statusText.textContent = 'Salvo automaticamente';
                    }
                }, 2000);
            }
        }

        function toggleActionsMenu() {
            const dropdown = document.getElementById('actionsDropdown');
            dropdown.classList.toggle('show');
        }

        // Fechar dropdown ao clicar fora
        window.addEventListener('click', function(e) {
            if (!e.target.matches('.btn-actions') && !e.target.closest('.btn-actions')) {
                const dropdown = document.getElementById('actionsDropdown');
                if (dropdown && dropdown.classList.contains('show')) {
                    dropdown.classList.remove('show');
                }
            }
        });

        function scheduleAutoSave(delay = 1500) {
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveToFirebase();
            }, delay);
        }

        function toggleCategory(categoryContainer) {
            const content = categoryContainer.querySelector('.category-content');
            const icon = categoryContainer.querySelector('.category-toggle');
            
            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }

        function renderDisciplines() {
            const container = document.getElementById('disciplinesContainer');
            container.innerHTML = '';

            for (const [category, categoryData] of Object.entries(studyContent)) {
                const categoryContainer = document.createElement('div');
                categoryContainer.className = 'category-container';
                
                // Header da categoria com toggle
                const categoryHeader = document.createElement('div');
                categoryHeader.className = 'category-header';
                categoryHeader.onclick = () => toggleCategory(categoryContainer);
                
                const categoryToggle = document.createElement('span');
                categoryToggle.className = 'category-toggle collapsed';
                categoryToggle.textContent = '▼';
                
                const categoryTitle = document.createElement('div');
                categoryTitle.className = 'category-title';
                categoryTitle.textContent = categoryData._fullTitle || category;
                
                categoryHeader.appendChild(categoryToggle);
                categoryHeader.appendChild(categoryTitle);
                categoryContainer.appendChild(categoryHeader);
                
                // Conteúdo da categoria (disciplinas) - iniciando fechado
                const categoryContent = document.createElement('div');
                categoryContent.className = 'category-content collapsed';

                for (const [discipline, disciplineData] of Object.entries(categoryData.disciplines)) {
                    const topics = disciplineData.topics;
                    const disciplineDiv = document.createElement('div');
                    disciplineDiv.className = 'discipline';

                    const header = document.createElement('div');
                    header.className = 'discipline-header';
                    header.onclick = () => toggleDiscipline(disciplineDiv);

                    // Container do título com ícone
                    const titleContainer = document.createElement('div');
                    titleContainer.className = 'discipline-title-container';
                    
                    const toggleIcon = document.createElement('span');
                    toggleIcon.className = 'discipline-toggle-icon collapsed';
                    toggleIcon.textContent = '▼';
                    
                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'discipline-title';
                    titleDiv.textContent = disciplineData._fullTitle || discipline;

                    titleContainer.appendChild(toggleIcon);
                    titleContainer.appendChild(titleDiv);

                    // Progresso no canto inferior direito
                    const progressDiv = document.createElement('div');
                    progressDiv.className = 'discipline-progress';
                    
                    const miniProgress = document.createElement('div');
                    miniProgress.className = 'mini-progress';
                    const miniBar = document.createElement('div');
                    miniBar.className = 'mini-progress-bar';
                    miniBar.id = `mini-${category}-${discipline}`;
                    miniProgress.appendChild(miniBar);
                    
                    const percentSpan = document.createElement('span');
                    percentSpan.id = `percent-${category}-${discipline}`;
                    percentSpan.textContent = '0%';
                    percentSpan.style.fontWeight = 'bold';

                    progressDiv.appendChild(miniProgress);
                    progressDiv.appendChild(percentSpan);

                    header.appendChild(titleContainer);
                    header.appendChild(progressDiv);

                    const content = document.createElement('div');
                    content.className = 'discipline-content collapsed';

                    topics.forEach(topic => {
                        const topicDiv = document.createElement('div');
                        topicDiv.className = 'topic';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'topic-name';
                        nameDiv.textContent = topic;

                        const controlDiv = document.createElement('div');
                        controlDiv.className = 'topic-control';

                        const sliderContainer = document.createElement('div');
                        sliderContainer.className = 'slider-container';

                        const slider = document.createElement('input');
                        slider.type = 'range';
                        slider.min = '0';
                        slider.max = '10';
                        slider.value = progressData[`${category}|${discipline}|${topic}`] || 0;
                        
                        const valueDisplay = document.createElement('span');
                        valueDisplay.className = 'value-display';
                        valueDisplay.textContent = slider.value;

                        slider.oninput = function() {
                            valueDisplay.textContent = this.value;
                            progressData[`${category}|${discipline}|${topic}`] = parseInt(this.value);
                            updateProgress();
                            scheduleAutoSave();
                        };

                        sliderContainer.appendChild(slider);
                        sliderContainer.appendChild(valueDisplay);
                        controlDiv.appendChild(sliderContainer);
                        
                        // Botões de Notebook por tópico (múltiplos)
                        const topicKey = `${category}|${discipline}|${topic}`;
                        const notebooks = topicNotebooks[topicKey] || [];
                        
                        const notebookBtnsContainer = document.createElement('div');
                        notebookBtnsContainer.className = 'topic-notebook-buttons';
                        
                        // Renderizar botões existentes
                        notebooks.forEach((notebook, index) => {
                            const notebookWrapper = document.createElement('div');
                            notebookWrapper.className = 'notebook-btn-wrapper';
                            
                            const viewNotebookBtn = document.createElement('button');
                            viewNotebookBtn.className = 'topic-notebook-btn topic-notebook-btn-view';
                            viewNotebookBtn.innerHTML = `<span>📖</span><span>${notebook.name}</span>`;
                            viewNotebookBtn.title = `Abrir: ${notebook.name}`;
                            viewNotebookBtn.onclick = (e) => {
                                e.stopPropagation();
                                window.open(notebook.url, '_blank', 'noopener,noreferrer');
                            };
                            viewNotebookBtn.oncontextmenu = (e) => {
                                e.preventDefault();
                                editNotebook(topicKey, index);
                            };
                            
                            // Botão de opções (mobile-friendly)
                            const optionsBtn = document.createElement('button');
                            optionsBtn.className = 'topic-notebook-btn-options';
                            optionsBtn.innerHTML = '⋮';
                            optionsBtn.title = 'Editar ou remover';
                            optionsBtn.onclick = (e) => {
                                e.stopPropagation();
                                editNotebook(topicKey, index);
                            };
                            
                            notebookWrapper.appendChild(viewNotebookBtn);
                            notebookWrapper.appendChild(optionsBtn);
                            notebookBtnsContainer.appendChild(notebookWrapper);
                        });
                        
                        // Botão Adicionar Notebook
                        const addNotebookBtn = document.createElement('button');
                        addNotebookBtn.className = 'topic-notebook-btn topic-notebook-btn-add';
                        addNotebookBtn.innerHTML = '<span>➕</span>';
                        addNotebookBtn.title = 'Adicionar novo notebook/material';
                        addNotebookBtn.onclick = (e) => {
                            e.stopPropagation();
                            addTopicNotebook(category, discipline, topic, topicKey);
                        };
                        
                        notebookBtnsContainer.appendChild(addNotebookBtn);
                        controlDiv.appendChild(notebookBtnsContainer);
                        
                        topicDiv.appendChild(nameDiv);
                        topicDiv.appendChild(controlDiv);
                        content.appendChild(topicDiv);
                    });

                    disciplineDiv.appendChild(header);
                    disciplineDiv.appendChild(content);
                    categoryContent.appendChild(disciplineDiv);
                }

                categoryContainer.appendChild(categoryContent);
                container.appendChild(categoryContainer);
            }

            updateProgress();
        }

        function toggleDiscipline(disciplineDiv) {
            const content = disciplineDiv.querySelector('.discipline-content');
            const icon = disciplineDiv.querySelector('.discipline-toggle-icon');
            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }

        // Armazenamento de notebooks por tópico (array de {name, url})
        let topicNotebooks = {};

        // Função para adicionar notebook a um tópico
        async function addTopicNotebook(category, discipline, topic, topicKey) {
            const name = prompt(
                `📝 Nome do Material para:\n${topic}\n\n` +
                `Digite um nome curto (ex: "Aula 1", "Resumo", "NotebookLM"):`,
                ''
            );
            
            if (!name || name.trim() === '') return; // Cancelou ou vazio
            
            const url = prompt(
                `🔗 URL do Material: ${name}\n\n` +
                `Cole o link:\n` +
                `• NotebookLM\n` +
                `• Google Docs\n` +
                `• YouTube, PDF, etc`,
                ''
            );
            
            if (!url || url.trim() === '') return; // Cancelou ou vazio
            
            // Inicializar array se não existir
            if (!topicNotebooks[topicKey]) {
                topicNotebooks[topicKey] = [];
            }
            
            // Adicionar notebook
            topicNotebooks[topicKey].push({
                name: name.trim(),
                url: url.trim()
            });
            
            await saveTopicNotebooks();
            renderDisciplines();
        }
        
        // Função para editar/remover notebook (clique direito)
        async function editNotebook(topicKey, index) {
            const notebooks = topicNotebooks[topicKey];
            if (!notebooks || !notebooks[index]) return;
            
            const notebook = notebooks[index];
            
            const action = confirm(
                `📖 ${notebook.name}\n` +
                `🔗 ${notebook.url}\n\n` +
                `OK = Editar | Cancelar = Remover`
            );
            
            if (action) {
                // Editar
                const newName = prompt('📝 Novo nome:', notebook.name);
                if (newName && newName.trim()) {
                    const newUrl = prompt('🔗 Nova URL:', notebook.url);
                    if (newUrl && newUrl.trim()) {
                        notebooks[index] = {
                            name: newName.trim(),
                            url: newUrl.trim()
                        };
                        await saveTopicNotebooks();
                        renderDisciplines();
                    }
                }
            } else {
                // Remover
                if (confirm(`❌ Remover "${notebook.name}"?`)) {
                    notebooks.splice(index, 1);
                    if (notebooks.length === 0) {
                        delete topicNotebooks[topicKey];
                    }
                    await saveTopicNotebooks();
                    renderDisciplines();
                }
            }
        }

        // Salvar notebooks no Firestore
        async function saveTopicNotebooks() {
            if (!currentProcesso) return;
            
            try {
                const auth = window.firebaseAuth;
                
                if (!auth.currentUser) {
                    alert('❌ Usuário não autenticado');
                    return;
                }
                
                const progressId = `${auth.currentUser.uid}_${currentProcesso.id}`;
                await setDoc(doc(db, 'progress', progressId), {
                    userId: auth.currentUser.uid,
                    processoId: currentProcesso.id,
                    progressData: progressData,
                    topicNotebooks: topicNotebooks,
                    lastUpdated: serverTimestamp()
                }, { merge: true });
                
                console.log('✅ Notebooks salvos com sucesso!');
            } catch (error) {
                console.error('❌ Erro ao salvar notebooks:', error);
                alert(`Erro ao salvar: ${error.message}`);
            }
        }

        // Carregar notebooks do Firestore
        async function loadTopicNotebooks() {
            if (!currentProcesso) return;
            
            try {
                const auth = window.firebaseAuth;
                
                if (!auth.currentUser) {
                    console.log('Usuário não autenticado, pulando carregamento de notebooks');
                    return;
                }
                
                const progressId = `${auth.currentUser.uid}_${currentProcesso.id}`;
                const docSnap = await getDoc(doc(db, 'progress', progressId));
                
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    const loadedNotebooks = data.topicNotebooks || {};
                    
                    // Migrar dados antigos (string) para novo formato (array)
                    topicNotebooks = {};
                    for (const [key, value] of Object.entries(loadedNotebooks)) {
                        if (typeof value === 'string') {
                            // Formato antigo: converter string para array
                            topicNotebooks[key] = [{ name: 'Material', url: value }];
                        } else if (Array.isArray(value)) {
                            // Formato novo: já é array
                            topicNotebooks[key] = value;
                        }
                    }
                    
                    console.log('✅ Notebooks carregados:', Object.keys(topicNotebooks).length);
                }
            } catch (error) {
                console.error('❌ Erro ao carregar notebooks:', error);
            }
        }

        function updateProgress() {
            let totalTopics = 0;
            let totalScore = 0;
            let completedTopics = 0;

            // Atualizar progresso geral
            for (const [key, value] of Object.entries(progressData)) {
                totalTopics++;
                totalScore += value;
                if (value === 10) completedTopics++;
            }

            const totalPercent = totalTopics > 0 ? (totalScore / (totalTopics * 10) * 100).toFixed(1) : 0;
            const averageScore = totalTopics > 0 ? (totalScore / totalTopics).toFixed(1) : 0;

            document.getElementById('totalProgress').style.width = totalPercent + '%';
            document.getElementById('totalProgress').textContent = totalPercent + '%';
            document.getElementById('totalPercent').textContent = totalPercent + '%';
            document.getElementById('totalTopics').textContent = totalTopics;
            document.getElementById('completedTopics').textContent = completedTopics;
            document.getElementById('averageScore').textContent = averageScore;

            // Atualizar progresso por disciplina
            for (const [category, categoryData] of Object.entries(studyContent)) {
                for (const [discipline, disciplineData] of Object.entries(categoryData.disciplines)) {
                    const topics = disciplineData.topics;
                    let disciplineScore = 0;
                    topics.forEach(topic => {
                        disciplineScore += progressData[`${category}|${discipline}|${topic}`] || 0;
                    });
                    const disciplinePercent = (disciplineScore / (topics.length * 10) * 100).toFixed(1);
                    
                    const miniBar = document.getElementById(`mini-${category}-${discipline}`);
                    const percentSpan = document.getElementById(`percent-${category}-${discipline}`);
                    
                    if (miniBar) miniBar.style.width = disciplinePercent + '%';
                    if (percentSpan) percentSpan.textContent = disciplinePercent + '%';
                }
            }
        }

        async function saveProgress() {
            await saveToFirebase();
        }

        async function resetProgress() {
            const dropdown = document.getElementById('actionsDropdown');
            dropdown.classList.remove('show');
            
            if (confirm('⚠️ Tem certeza que deseja resetar todo o progresso? Esta ação não pode ser desfeita.')) {
                progressData = {};
                for (const [category, categoryData] of Object.entries(studyContent)) {
                    for (const [discipline, disciplineData] of Object.entries(categoryData.disciplines)) {
                        disciplineData.topics.forEach(topic => {
                            progressData[`${category}|${discipline}|${topic}`] = 0;
                        });
                    }
                }
                await saveToFirebase();
                renderDisciplines();
                updateSaveStatus('saved', 'Progresso resetado');
            }
        }

        function exportProgress() {
            const dropdown = document.getElementById('actionsDropdown');
            dropdown.classList.remove('show');
            
            const dataStr = JSON.stringify(progressData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `progresso-estudos-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        progressData = imported;
                        await saveToFirebase();
                        renderDisciplines();
                        updateSaveStatus('saved', 'Progresso importado');
                    } catch (error) {
                        alert('❌ Erro ao importar arquivo. Verifique se é um arquivo JSON válido.');
                    }
                };
                reader.readAsText(file);
            }
            event.target.value = '';
        }

        // Inicializar Firebase e carregar página
        async function initPage() {
            try {
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
                const { getAuth } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js');
                const { getFirestore } = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
                const { firebaseConfig } = await import('./js/firebase-config.js');
                
                // Inicializar Firebase
                const app = initializeApp(firebaseConfig);
                window.firebaseAuth = getAuth(app);
                window.firebaseDb = getFirestore(app);
                
                // Verificar autenticação
                window.firebaseAuth.onAuthStateChanged(async (user) => {
                    if (!user) {
                        window.location.href = 'login.html';
                        return;
                    }
                    
                    // Carregar conteúdo
                    await loadStudyContent();
                    
                    if (Object.keys(studyContent).length > 0) {
                        await loadFromFirebase();
                        renderDisciplines();
                    } else {
                        alert('⚠️ Não foi possível carregar o conteúdo de estudos');
                    }
                });
            } catch (error) {
                console.error('Erro ao inicializar:', error);
                alert('❌ Erro ao carregar a aplicação');
            }
        }

        // Inicializar ao carregar a página
        window.addEventListener('load', initPage);
        
        // Salvar automaticamente ao sair
        window.addEventListener('beforeunload', () => {
            if (autoSaveTimer) {
                clearTimeout(autoSaveTimer);
                // Salvar de forma síncrona ao sair (melhor esforço)
                if (!isSaving && currentProcessId) {
                    navigator.sendBeacon && saveToFirebase();
                }
            }
        });
    </script>
    <script src="js/embed-modal.js"></script>
    <script>
        // Inicializar EmbedModal quando a página carregar
        window.addEventListener('load', () => {
            initEmbedModal();
        });
    </script>
</body>
