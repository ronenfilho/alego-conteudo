        let studyContent = {};
        let progressData = {};

        // Parser do Markdown para estrutura de dados
        function parseMarkdownToContent(markdown) {
            const content = {};
            const lines = markdown.split('\n');
            let currentCategory = null;
            let currentDiscipline = null;

            for (let line of lines) {
                line = line.trim();
                
                // Detectar categoria (## ANALISTA LEGISLATIVO ou ## CONHECIMENTOS)
                if (line.startsWith('## ') && !line.includes('#')) {
                    const categoryMatch = line.match(/^##\s+(.+)/);
                    if (categoryMatch) {
                        const categoryName = categoryMatch[1].trim();
                        // Separar por "–" se existir
                        if (categoryName.includes('–')) {
                            currentCategory = categoryName.split('–')[0].trim();
                        } else if (categoryName.includes('CONHECIMENTOS')) {
                            currentCategory = categoryName;
                        }
                        
                        if (currentCategory && currentCategory.includes('CONHECIMENTOS')) {
                            if (!content[currentCategory]) {
                                content[currentCategory] = {};
                            }
                            currentDiscipline = null;
                        }
                    }
                }
                // Detectar disciplina (### NOME - número ou ### NOME)
                else if (line.startsWith('### ') && currentCategory) {
                    const disciplineMatch = line.match(/^###\s+(.+?)(?:\s+-\s+\d+)?$/);
                    if (disciplineMatch) {
                        currentDiscipline = disciplineMatch[1].trim();
                        if (!content[currentCategory][currentDiscipline]) {
                            content[currentCategory][currentDiscipline] = [];
                        }
                    }
                }
                // Detectar tópicos (linhas começando com número.)
                else if (/^\d+\./.test(line) && currentDiscipline && currentCategory) {
                    const topicMatch = line.match(/^\d+\.\s+(.+)/);
                    if (topicMatch) {
                        const topic = topicMatch[1].trim();
                        content[currentCategory][currentDiscipline].push(topic);
                    }
                }
            }

            return content;
        }

        // Função para carregar o conteúdo
        function loadStudyContent() {
            studyContent = parseMarkdownToContent(markdownContent);
            return studyContent;
        }

        const STORAGE_KEY = 'studyProgress_v2';
        const META_KEY = STORAGE_KEY + '_meta';
        const DB_NAME = 'progressDB';
        const STORE_NAME = 'progressStore';
        let autoSaveTimer = null;

        function idbAvailable() {
            return !!window.indexedDB;
        }

        function idbOpen() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = (e) => resolve(e.target.result);
                req.onerror = (e) => reject(e.target.error);
            });
        }

        async function idbSave(data) {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).put(data, STORAGE_KEY);
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        async function idbLoad() {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readonly');
                const req = tx.objectStore(STORE_NAME).get(STORAGE_KEY);
                req.onsuccess = () => { db.close(); resolve(req.result); };
                req.onerror = () => { db.close(); reject(req.error); };
            });
        }

        async function idbClear() {
            const db = await idbOpen();
            return new Promise((resolve, reject) => {
                const tx = db.transaction(STORE_NAME, 'readwrite');
                tx.objectStore(STORE_NAME).delete(STORAGE_KEY);
                tx.oncomplete = () => { db.close(); resolve(); };
                tx.onerror = () => { db.close(); reject(tx.error); };
            });
        }

        async function saveToStorage() {
            try {
                if (idbAvailable()) {
                    await idbSave(progressData);
                    localStorage.setItem(META_KEY, JSON.stringify({ type: 'indexedDB', ts: new Date().toISOString() }));
                } else {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(progressData));
                    localStorage.setItem(META_KEY, JSON.stringify({ type: 'localStorage', ts: new Date().toISOString() }));
                }
                updateStatus();
            } catch (err) {
                console.error('saveToStorage error', err);
            }
        }

        async function loadFromStorage() {
            try {
                if (idbAvailable()) {
                    const loaded = await idbLoad();
                    if (loaded) {
                        progressData = loaded;
                        return;
                    }
                }
                const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('studyProgress');
                if (raw) {
                    progressData = JSON.parse(raw);
                    return;
                }

                // Se não havia nada salvo, inicializa com zeros
                for (const [category, disciplines] of Object.entries(studyContent)) {
                    for (const [discipline, topics] of Object.entries(disciplines)) {
                        topics.forEach(topic => {
                            const key = `${category}|${discipline}|${topic}`;
                            if (!(key in progressData)) progressData[key] = 0;
                        });
                    }
                }
            } catch (err) {
                console.error('loadFromStorage error', err);
            }
        }

        async function clearStorage() {
            try {
                if (idbAvailable()) await idbClear();
                localStorage.removeItem(STORAGE_KEY);
                localStorage.removeItem('studyProgress');
                localStorage.removeItem(META_KEY);
                updateStatus();
            } catch (err) {
                console.error('clearStorage error', err);
            }
        }

        function updateStatus() {
            const el = document.getElementById('saveStatus');
            if (!el) return;
            const metaRaw = localStorage.getItem(META_KEY);
            if (metaRaw) {
                try {
                    const meta = JSON.parse(metaRaw);
                    el.textContent = `Último salvamento: ${new Date(meta.ts).toLocaleString()} (${meta.type})`;
                    return;
                } catch {}
            }
            el.textContent = 'Nenhum salvamento local encontrado';
        }

        function scheduleAutoSave(delay = 800) {
            if (autoSaveTimer) clearTimeout(autoSaveTimer);
            autoSaveTimer = setTimeout(() => {
                saveToStorage();
            }, delay);
        }

        function renderDisciplines() {
            const container = document.getElementById('disciplinesContainer');
            container.innerHTML = '';

            for (const [category, disciplines] of Object.entries(studyContent)) {
                const categoryDiv = document.createElement('div');
                categoryDiv.style.marginBottom = '40px';
                
                const categoryTitle = document.createElement('h2');
                categoryTitle.style.color = '#667eea';
                categoryTitle.style.marginBottom = '20px';
                categoryTitle.style.fontSize = '1.8em';
                categoryTitle.textContent = category;
                categoryDiv.appendChild(categoryTitle);

                for (const [discipline, topics] of Object.entries(disciplines)) {
                    const disciplineDiv = document.createElement('div');
                    disciplineDiv.className = 'discipline';

                    const header = document.createElement('div');
                    header.className = 'discipline-header';
                    header.onclick = () => toggleDiscipline(disciplineDiv);

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'discipline-title';
                    titleDiv.innerHTML = `<span class="toggle-icon">▼</span> ${discipline}`;

                    const progressDiv = document.createElement('div');
                    progressDiv.className = 'discipline-progress';
                    
                    const miniProgress = document.createElement('div');
                    miniProgress.className = 'mini-progress';
                    const miniBar = document.createElement('div');
                    miniBar.className = 'mini-progress-bar';
                    miniBar.id = `mini-${category}-${discipline}`;
                    miniProgress.appendChild(miniBar);
                    
                    const percentSpan = document.createElement('span');
                    percentSpan.id = `percent-${category}-${discipline}`;
                    percentSpan.textContent = '0%';
                    percentSpan.style.fontWeight = 'bold';

                    progressDiv.appendChild(miniProgress);
                    progressDiv.appendChild(percentSpan);

                    header.appendChild(titleDiv);
                    header.appendChild(progressDiv);

                    const content = document.createElement('div');
                    content.className = 'discipline-content';

                    topics.forEach(topic => {
                        const topicDiv = document.createElement('div');
                        topicDiv.className = 'topic';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'topic-name';
                        nameDiv.textContent = topic;

                        const controlDiv = document.createElement('div');
                        controlDiv.className = 'topic-control';

                        const sliderContainer = document.createElement('div');
                        sliderContainer.className = 'slider-container';

                        const slider = document.createElement('input');
                        slider.type = 'range';
                        slider.min = '0';
                        slider.max = '10';
                        slider.value = progressData[`${category}|${discipline}|${topic}`] || 0;
                        
                        const valueDisplay = document.createElement('span');
                        valueDisplay.className = 'value-display';
                        valueDisplay.textContent = slider.value;

                        slider.oninput = function() {
                            valueDisplay.textContent = this.value;
                            progressData[`${category}|${discipline}|${topic}`] = parseInt(this.value);
                            updateProgress();
                            scheduleAutoSave();
                        };

                        sliderContainer.appendChild(slider);
                        sliderContainer.appendChild(valueDisplay);
                        controlDiv.appendChild(sliderContainer);
                        
                        topicDiv.appendChild(nameDiv);
                        topicDiv.appendChild(controlDiv);
                        content.appendChild(topicDiv);
                    });

                    disciplineDiv.appendChild(header);
                    disciplineDiv.appendChild(content);
                    categoryDiv.appendChild(disciplineDiv);
                }

                container.appendChild(categoryDiv);
            }

            updateProgress();
        }

        function toggleDiscipline(disciplineDiv) {
            const content = disciplineDiv.querySelector('.discipline-content');
            const icon = disciplineDiv.querySelector('.toggle-icon');
            content.classList.toggle('collapsed');
            icon.classList.toggle('collapsed');
        }

        function updateProgress() {
            let totalTopics = 0;
            let totalScore = 0;
            let completedTopics = 0;

            // Atualizar progresso geral
            for (const [key, value] of Object.entries(progressData)) {
                totalTopics++;
                totalScore += value;
                if (value === 10) completedTopics++;
            }

            const totalPercent = totalTopics > 0 ? (totalScore / (totalTopics * 10) * 100).toFixed(1) : 0;
            const averageScore = totalTopics > 0 ? (totalScore / totalTopics).toFixed(1) : 0;

            document.getElementById('totalProgress').style.width = totalPercent + '%';
            document.getElementById('totalProgress').textContent = totalPercent + '%';
            document.getElementById('totalPercent').textContent = totalPercent + '%';
            document.getElementById('totalTopics').textContent = totalTopics;
            document.getElementById('completedTopics').textContent = completedTopics;
            document.getElementById('averageScore').textContent = averageScore;

            // Atualizar progresso por disciplina
            for (const [category, disciplines] of Object.entries(studyContent)) {
                for (const [discipline, topics] of Object.entries(disciplines)) {
                    let disciplineScore = 0;
                    topics.forEach(topic => {
                        disciplineScore += progressData[`${category}|${discipline}|${topic}`] || 0;
                    });
                    const disciplinePercent = (disciplineScore / (topics.length * 10) * 100).toFixed(1);
                    
                    const miniBar = document.getElementById(`mini-${category}-${discipline}`);
                    const percentSpan = document.getElementById(`percent-${category}-${discipline}`);
                    
                    if (miniBar) miniBar.style.width = disciplinePercent + '%';
                    if (percentSpan) percentSpan.textContent = disciplinePercent + '%';
                }
            }
        }

        async function saveProgress() {
            await saveToStorage();
            alert('✅ Progresso salvo com sucesso!');
        }

        async function resetProgress() {
            if (confirm('⚠️ Tem certeza que deseja resetar todo o progresso? Esta ação não pode ser desfeita.')) {
                progressData = {};
                for (const [category, disciplines] of Object.entries(studyContent)) {
                    for (const [discipline, topics] of Object.entries(disciplines)) {
                        topics.forEach(topic => {
                            progressData[`${category}|${discipline}|${topic}`] = 0;
                        });
                    }
                }
                await clearStorage();
                await saveToStorage();
                renderDisciplines();
                alert('🔄 Progresso resetado!');
            }
        }

        function exportProgress() {
            const dataStr = JSON.stringify(progressData, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `progresso-estudos-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importProgress(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    try {
                        const imported = JSON.parse(e.target.result);
                        progressData = imported;
                        await saveToStorage();
                        renderDisciplines();
                        alert('✅ Progresso importado com sucesso!');
                    } catch (error) {
                        alert('❌ Erro ao importar arquivo. Verifique se é um arquivo JSON válido.');
                    }
                };
                reader.readAsText(file);
            }
        }

        // Inicializar ao carregar a página
        window.addEventListener('load', async () => {
            // Carrega o conteúdo do Markdown embutido
            loadStudyContent();
            
            // Se o conteúdo foi carregado, procede com a inicialização
            if (Object.keys(studyContent).length > 0) {
                await loadFromStorage();
                renderDisciplines();
                updateStatus();
            } else {
                alert('⚠️ Não foi possível parsear o conteúdo de estudos.');
            }
            
            // salva automaticamente ao sair
            window.addEventListener('beforeunload', () => {
                if (autoSaveTimer) clearTimeout(autoSaveTimer);
                // If IndexedDB is not available, ensure data is persisted to localStorage synchronously
                if (!idbAvailable()) saveToStorage();
            });
        });
    </script>
</body>
